<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AeroRAG — Premium PDF Assistant</title>
  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-glow"></div>
  
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <h1>AeroRAG</h1>
      </div>
      <p class="subtitle">Next-gen Document Retrieval & Generation</p>
    </header>

    <main class="app-main">
      <!-- Upload Card -->
      <section class="card upload-card" aria-label="PDF Document Upload">
        <div class="card-header">
          <h2>📄 Document Indexer</h2>
          <span class="badge" id="indexerBadge">Active</span>
        </div>
        <div class="upload-dropzone" id="dropzone">
          <input type="file" id="pdfFile" accept="application/pdf" class="file-input" />
          <label for="pdfFile" class="file-label">
            <span class="upload-icon">📤</span>
            <span class="upload-text">Choose a PDF or drag it here</span>
          </label>
        </div>
        <div class="action-row">
          <button id="uploadBtn" class="btn btn-primary">Index Document</button>
        </div>
        <p id="uploadStatus" class="status-text"></p>
      </section>

      <!-- Chat Card -->
      <section class="card chat-card" aria-label="AI Chat Assistant">
        <div class="card-header">
          <h2>💬 AI Assistant</h2>
          <span class="badge badge-pulse" id="chatBadge">Ready</span>
        </div>
        <div class="chat-container">
          <div id="messages" class="messages-feed" role="log" aria-live="polite">
            <!-- Messages will be injected here dynamically -->
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="questionInput" placeholder="Ask a question about the document..." aria-label="Question input" />
          <button id="askBtn" class="btn btn-accent" aria-label="Send question">
            <span>Ask</span>
            <span class="btn-icon">➔</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 AeroRAG. Powered by Cohere & Groq.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
